<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人工作台 — Demo</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
:root{--bg:#1a1b1e;--bg-panel:#212327;--bg-card:#282a2f;--bg-input:#1a1b1e;--bg-hover:#2f3238;--border:#363940;--text:#d0d3d8;--text-dim:#8b8f97;--text-bright:#e8eaed;--accent:#5b8def;--accent-hover:#7aa5f4;--success:#4caf93;--warning:#e5a854;--danger:#e0556a;--purple:#9b7fe6;--radius:6px;--radius-lg:10px;--font:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:#121316;color:var(--text);overflow:hidden;height:100vh}
#root{height:100vh;display:flex;flex-direction:column}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.app-shell{display:flex;flex:1;overflow:hidden}
.sidebar{width:220px;min-width:220px;background:var(--bg-panel);border-right:1px solid var(--border);display:flex;flex-direction:column}
.sidebar-header{padding:12px;font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid var(--border)}
.main-editor{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.preview-panel{width:360px;min-width:360px;background:var(--bg-panel);border-left:1px solid var(--border);display:flex;flex-direction:column}
.toolbar{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;background:var(--bg-panel);border-bottom:1px solid var(--border)}
.toolbar .spacer{flex:1}
.tab-bar{display:flex;border-bottom:1px solid var(--border);background:var(--bg-panel)}
.tab-bar .tab{padding:10px 20px;font-size:13px;cursor:pointer;color:var(--text-dim);border-bottom:2px solid transparent;user-select:none;white-space:nowrap}
.tab-bar .tab:hover{color:var(--text);background:var(--bg-hover)}
.tab-bar .tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab-content{flex:1;overflow-y:auto;padding:16px}
.btn{padding:6px 14px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-card);color:var(--text);cursor:pointer;font-size:12px;transition:all .15s;font-family:inherit;white-space:nowrap}
.btn:hover{background:var(--bg-hover);border-color:#555}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-hover)}
.btn.danger{border-color:var(--danger);color:var(--danger)}.btn.danger:hover{background:var(--danger);color:#fff}
.btn.sm{padding:3px 10px;font-size:11px}.btn.xs{padding:2px 7px;font-size:10px}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600}
.badge.done{background:rgba(76,175,147,.15);color:var(--success)}
.badge.pending{background:rgba(139,143,151,.1);color:var(--text-dim)}
.badge.generating{background:rgba(229,168,84,.15);color:var(--warning)}
.badge.failed{background:rgba(224,85,106,.15);color:var(--danger)}
textarea,input[type=text],select{width:100%;padding:8px 10px;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:13px;font-family:inherit}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--accent)}textarea{resize:vertical;line-height:1.7}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:100;animation:fadeIn .15s}
.modal{background:var(--bg-panel);border:1px solid var(--border);border-radius:var(--radius-lg);width:480px;max-height:85vh;overflow-y:auto;box-shadow:0 8px 40px rgba(0,0,0,.5);animation:slideUp .2s}
.modal.wide{width:680px}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border);font-weight:600;font-size:14px}
.modal-body{padding:16px}.modal-footer{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}
.form-group{margin-bottom:12px}.form-group label{display:block;font-size:11px;color:var(--text-dim);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.form-row{display:flex;gap:10px}.form-row .form-group{flex:1}
@keyframes fadeIn{from{opacity:0}}@keyframes slideUp{from{transform:translateY(20px);opacity:0}}
.evo-badge{display:inline-block;padding:1px 6px;border-radius:4px;font-size:9px;font-weight:700;vertical-align:middle;margin-left:4px}
.evo-badge.v10{background:rgba(91,141,239,.2);color:var(--accent)}.evo-badge.v12{background:rgba(155,127,230,.2);color:var(--purple)}
.asset-layout{display:flex;flex:1;height:100%}
.asset-left{width:260px;border-right:1px solid var(--border);overflow-y:auto;padding:8px;background:var(--bg-panel)}
.asset-right{flex:1;padding:16px;overflow-y:auto}
.preview-box{width:100%;height:240px;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius-lg);display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.angle-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.angle-slot{aspect-ratio:3/4;background:var(--bg-input);border:2px dashed var(--border);border-radius:var(--radius);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-size:10px;color:var(--text-dim);text-align:center;transition:all .15s}
.angle-slot:hover{border-color:var(--accent)}.angle-slot.filled{border-style:solid;border-color:var(--success);background:var(--bg-card)}
.annotation-canvas{width:100%;height:220px;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius-lg);position:relative;overflow:hidden;margin-bottom:12px}
.annotation-canvas .bg-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--text-dim);opacity:.4}
.annotation-canvas .bbox{position:absolute;border:2px solid var(--accent);border-radius:2px;background:rgba(91,141,239,.08);cursor:pointer}
.annotation-canvas .bbox.selected{border-color:var(--warning);background:rgba(229,168,84,.12)}
.annotation-canvas .bbox .bbox-label{position:absolute;top:-14px;left:0;font-size:8px;color:var(--accent);background:var(--bg-panel);padding:1px 5px;border-radius:2px;white-space:nowrap}
.prompt-block{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;margin-bottom:8px}
.prompt-block .pb-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.prompt-tag{padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600}
.prompt-tag.env{background:rgba(76,175,147,.15);color:var(--success)}
.prompt-tag.char{background:rgba(155,127,230,.15);color:var(--purple)}
.prompt-tag.fx{background:rgba(229,168,84,.15);color:var(--warning)}
.prompt-text{font-size:11px;line-height:1.5;font-family:'Cascadia Code','Fira Code','Consolas',monospace}
.timeline-box{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;margin-bottom:12px}
.tl-ruler{display:flex;justify-content:space-between;font-size:9px;color:var(--text-dim);margin-bottom:6px}
.tl-track{height:32px;background:var(--bg-input);border-radius:4px;position:relative}
.tl-event{position:absolute;top:5px;height:22px;border-radius:3px;font-size:8px;padding:3px 6px;color:#fff;overflow:hidden;white-space:nowrap;cursor:pointer}
.tl-event.action{background:var(--accent)}.tl-event.fx{background:var(--purple)}.tl-event.dialogue{background:var(--success)}
.toast{position:fixed;bottom:24px;right:24px;padding:10px 18px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);font-size:12px;z-index:200;box-shadow:0 4px 16px rgba(0,0,0,.4);animation:slideUp .2s}
.audit-panel{border-radius:var(--radius-lg);padding:14px 16px;margin-bottom:12px;border-left:3px solid var(--accent);background:rgba(91,141,239,.06)}
hr{ border-color:var(--border);margin:12px 0}
h4{font-size:12px;color:var(--text-dim);margin-bottom:8px}
.ref-tag{padding:3px 10px;border-radius:12px;font-size:11px;background:rgba(91,141,239,.1);color:var(--accent);border:1px solid rgba(91,141,239,.2)}
</style>
</head>
<body><div id="root"></div>
<script type="text/babel">
const { useState, useRef, useEffect } = React;

// ============ DEMO DATA ============
const D = {
  project: { id:'p1', name:'古宅探秘·第1集',
    outline:'深夜，独行探险家林墨潜入一座荒废百年的欧式古宅。大厅中，他发现地面上刻满了发光的符文，符文的蓝光逐渐变得剧烈。突然，门自动关闭，一个巨大的阴影从楼梯上方蔓延下来……\n\n林墨举起手电筒，光束扫过墙壁上的古老壁画——那些画面似乎在蓝光中扭曲、蠕动。他听到身后传来低沉的呼吸声。',
    characters:[
      { id:'c1',name:'林墨',gender:'male',age:32,personality:'沉着冷静，话少但句句关键',background:'资深探险家，曾探索过数十座废弃古迹',appearance:'黑色短发，深蓝风衣，身高180cm，面容清瘦，左眉骨浅疤',voiceId:'v1'},
      { id:'c2',name:'幽灵女人',gender:'female',age:null,personality:'神秘莫测，亦正亦邪',background:'维多利亚时期幽灵',appearance:'白色长裙，蓝色空洞眼眸',voiceId:'v2'},
    ]
  },
  script:{ title:'古宅探秘', scenes:[
    { id:'s1',sceneNumber:1,location:'古宅大门外',timeOfDay:'夜',description:'月光下的哥特式古宅，铁门半掩，藤蔓爬满石墙。远处传来猫头鹰的鸣叫。',characters:['林墨'],actionDescription:'林墨推开铁门，手电筒光束扫过杂草丛生的前院。他深吸一口气，迈入大门。',dialogues:[{ id:'d1',characterName:'林墨',text:'就是这里了。',order:1 }] },
    { id:'s2',sceneNumber:2,location:'古宅大厅',timeOfDay:'夜',description:'挑高的哥特式大厅，月光透过破碎的彩色玻璃窗洒入。地面覆盖着厚厚的灰尘，中央刻着一圈复杂的符文。',characters:['林墨'],actionDescription:'林墨踏进大厅，手电筒光束扫过四周。符文突然开始发出微弱的蓝光，光线越来越强，脉动如同心跳。',dialogues:[{ id:'d2',characterName:'林墨',text:'这些符文……是活的？',order:1 }] },
    { id:'s3',sceneNumber:3,location:'古宅大厅·楼梯',timeOfDay:'夜',description:'巨大的阴影从楼梯上方蔓延下来，身着维多利亚时代长裙的女人缓缓步下。她的眼睛是空洞的蓝色光芒。',characters:['林墨','幽灵女人'],actionDescription:'阴影蔓延，女人从楼梯步下。林墨后退一步，手电筒光束照在她脸上。',dialogues:[{ id:'d3',characterName:'幽灵女人',text:'你终于来了。符文已经等了你一百年。',order:1 }] },
  ]},
  sbs:[
    { id:'sb1',sceneId:'s1',order:1,desc:'远景，哥特式古宅外立面的定场镜头',status:'done' },
    { id:'sb2',sceneId:'s1',order:2,desc:'中景，林墨推开铁门进入前院',status:'done' },
    { id:'sb3',sceneId:'s2',order:3,desc:'中景，林墨侧身站在大厅中央，低头凝视地面符文，蓝光漫射',status:'generating' },
    { id:'sb4',sceneId:'s3',order:4,desc:'中近景，幽灵女人从楼梯上缓缓步下',status:'pending' },
    { id:'sb5',sceneId:'s3',order:5,desc:'特写，幽灵女人的蓝色空洞眼眸',status:'pending' },
  ],
  assets:{
    chars:[{ id:'a1',name:'林墨',done:true,source:'imported',desc:'黑色短发，深蓝风衣，身高180cm，面容清瘦' },{ id:'a2',name:'幽灵女人',done:false,source:'generated',desc:'白色长裙，蓝色空洞眼眸，维多利亚风格' }],
    scenes:[{ id:'sc1',name:'古宅大厅',done:true,source:'generated',desc:'哥特式挑高大厅，彩窗，石壁，符文地面' }],
    items:[{ id:'i1',name:'符文石板',done:true,source:'imported',desc:'圆形石板，刻有发光符文，蓝光材质' }],
    voices:[{ id:'v1',name:'深沉男声-林墨',provider:'openai-tts',voiceId:'onyx',speed:1,pitch:0,sample:true },{ id:'v2',name:'空灵女声-幽灵',provider:'openai-tts',voiceId:'nova',speed:.9,pitch:2,sample:false }],
    styles:[{ id:'st1',name:'暗黑哥特风',strength:.7,desc:'冷色调暗部、强对比度、哥特建筑元素' }],
  }
};

// ============ HELPERS ============
const statusBadge = s => ({ done:<span className="badge done">✅ 已生成</span>, generating:<span className="badge generating">⏳ 生成中</span>, pending:<span className="badge pending">○ 待生成</span>, failed:<span className="badge failed">🔴 失败</span> }[s] || null);
const Toaster = React.createContext(()=>{});

// ============ MODALS ============
function CharacterModal({ char, onClose, toast }) {
  const c = char || { name:'', gender:'male', age:'', personality:'', background:'', appearance:'', voiceId:'' };
  return (
    <div className="modal-overlay" onClick={onClose}><div className="modal" onClick={e=>e.stopPropagation()}>
      <div className="modal-header">{char?'👤 编辑人物':'👤 添加人物'}<button onClick={onClose} style={{border:'none',background:'transparent',color:'var(--text-dim)',cursor:'pointer',fontSize:16}}>✕</button></div>
      <div className="modal-body">
        <div className="form-row"><div className="form-group"><label>姓名 *</label><input defaultValue={c.name}/></div><div className="form-group"><label>性别</label><select defaultValue={c.gender}><option value="male">男</option><option value="female">女</option><option value="other">其他</option></select></div><div className="form-group"><label>年龄</label><input defaultValue={c.age||''}/></div></div>
        <div className="form-group"><label>性格描述</label><input defaultValue={c.personality}/></div>
        <div className="form-group"><label>背景故事</label><textarea style={{minHeight:60}} defaultValue={c.background}/></div>
        <div className="form-group"><label>外观特征（用于生图提示词）</label><input defaultValue={c.appearance}/></div>
        <div className="form-group"><label>🔊 配音设置（从音色资产选择）</label><div style={{display:'flex',gap:8}}><select style={{flex:1}} defaultValue={c.voiceId||''}><option value="">不绑定音色</option><option value="v1">深沉男声-林墨 (OpenAI · onyx)</option><option value="v2">空灵女声-幽灵 (OpenAI · nova)</option></select><button className="btn sm" onClick={()=>toast('▶ 试听中...')}>▶ 试听</button></div></div>
      </div>
      <div className="modal-footer">{char&&<button className="btn danger">删除人物</button>}<button className="btn" onClick={onClose}>取消</button><button className="btn primary" onClick={()=>{toast('人物已保存');onClose();}}>保存</button></div>
    </div></div>
  );
}

function SettingsModal({ onClose, toast }) {
  return (
    <div className="modal-overlay" onClick={onClose}><div className="modal wide" onClick={e=>e.stopPropagation()}>
      <div className="modal-header">⚙ 全局设置<button onClick={onClose} style={{border:'none',background:'transparent',color:'var(--text-dim)',cursor:'pointer',fontSize:16}}>✕</button></div>
      <div className="modal-body">
        <h4>🤖 LLM（大语言模型）</h4>
        <div className="form-group"><label>模板</label><select><option>OpenAI</option><option>DeepSeek</option><option>自定义</option></select></div>
        <div className="form-row"><div className="form-group"><label>Base URL</label><input defaultValue="https://api.openai.com/v1"/></div><div className="form-group"><label>API Key</label><input type="password" defaultValue="sk-xxxxxxxx"/></div></div>
        <div className="form-row"><div className="form-group"><label>模型名称</label><input defaultValue="gpt-4o"/></div><div className="form-group"><label>最大 Token</label><input defaultValue="4096"/></div></div>
        <hr/><h4>🖼️ 生图模型</h4>
        <div className="form-row">
          <div className="form-group"><label>Base URL</label><input defaultValue="http://127.0.0.1:7860"/></div>
          <div className="form-group"><label>API Key</label><input type="password"/></div>
          <div className="form-group"><label>模板</label><select><option>Stable Diffusion WebUI</option><option>DALL·E</option><option>即梦 / 火山方舟</option><option>自定义</option></select></div>
        </div>
        <hr/><h4>🎥 视频生成模型</h4>
        <div className="form-group"><label>Base URL</label><input defaultValue="https://api.runwayml.com/v1"/></div>
        <div className="form-group"><label>API Key</label><input type="password"/></div>
        <div className="form-row">
          <div className="form-group"><label>模板</label><select><option>Runway Gen-3</option><option>Pika</option><option>Kling</option><option>即梦 / 火山方舟</option><option>自定义</option></select></div>
          <div className="form-group"><label>默认时长（秒）</label><input defaultValue="5"/></div>
        </div>
        <hr/><h4>🔊 语音模型 (TTS)</h4>
        <div className="form-group"><label>Base URL</label><input defaultValue="https://api.openai.com"/></div>
        <div className="form-group"><label>API Key</label><input type="password"/></div>
        <div className="form-row">
          <div className="form-group"><label>模板</label><select><option>OpenAI TTS</option><option>Edge TTS</option><option>MiniMax</option><option>即梦 / 火山方舟</option><option>自定义</option></select></div>
          <div className="form-group"><label>默认音色</label><select><option>alloy</option><option>echo</option><option>onyx</option></select></div>
        </div>
        <hr/><h4>🎞️ 分镜引擎 <span className="evo-badge v12">V1.2+</span></h4>
        <div className="form-group"><label>引擎版本</label><select><option>V1.0 — 简化模式（单一提示词）</option><option>V1.2 — 锚定模式（三类提示词 + 时间轴）</option></select></div>
        <hr/><h4>⚙️ 通用</h4>
        <div className="form-group"><label>FFmpeg 路径</label><input placeholder="留空使用内置 FFmpeg"/></div>
      </div>
      <div className="modal-footer"><button className="btn" onClick={onClose}>取消</button><button className="btn primary" onClick={()=>{toast('设置已保存');onClose();}}>保存设置</button></div>
    </div></div>
  );
}

function ExportModal({ onClose, toast }) {
  return (
    <div className="modal-overlay" onClick={onClose}><div className="modal wide" onClick={e=>e.stopPropagation()}>
      <div className="modal-header">📦 合成导出<button onClick={onClose} style={{border:'none',background:'transparent',color:'var(--text-dim)',cursor:'pointer',fontSize:16}}>✕</button></div>
      <div className="modal-body">
        <div className="form-row"><div className="form-group"><label>输出分辨率</label><select><option>1080p</option><option>720p</option><option>4K</option></select></div><div className="form-group"><label>帧率</label><select><option>24fps</option><option>30fps</option><option>60fps</option></select></div></div>
        <div className="form-group"><label>字幕</label><select><option>开启（硬编码嵌入）</option><option>开启（外挂 ASS）</option><option>关闭</option></select></div>
        <div className="form-group"><label>输出路径</label><input defaultValue="C:\Users\...\Videos\古宅探秘_第1集.mp4"/></div>
        <div style={{fontSize:12,color:'var(--text-dim)',marginTop:12}}>
          <strong>合成清单：</strong><br/>
          ✅ S01 古宅定场镜头 (5.0s) + 配音 ✓<br/>
          ✅ S02 林墨推门 (3.5s) + 配音 ✓<br/>
          ⏳ S03 符文渐亮 (4.5s) · 视频生成中<br/>
          ○ S04 幽灵女人 (6.0s) · 待生成<br/>
          ○ S05 眼睛特写 (3.0s) · 待生成
        </div>
      </div>
      <div className="modal-footer"><button className="btn" onClick={onClose}>取消</button><button className="btn primary" onClick={()=>{toast('合成任务已提交，预计 2 分钟完成');onClose();}}>开始合成</button></div>
    </div></div>
  );
}

// ============ ASSET PANEL ============
function AssetPanel({ sub, setSub, toast }) {
  const [selIdx, setSelIdx] = useState(0);
  const SUBTABS = [
    { key:'char',label:'👤 人物设定' },{ key:'scene',label:'🏙 场景设定' },{ key:'item',label:'📦 物品设计' },
    { key:'voice',label:'🔊 音色' },{ key:'style',label:'🎨 风格参考' },{ key:'sb',label:'🎞 分镜生图' },
    { key:'rolebook',label:'📖 角色书',v12:true },{ key:'annotation',label:'📍 场景标注',v12:true },
  ];

  const getList = () => {
    switch(sub){

  return (
    <div style={{display:'flex',flexDirection:'column',height:'100%'}}>
      <div style={{display:'flex',borderBottom:'1px solid var(--border)',background:'var(--bg-panel)',margin:'-16px -16px 0',overflow:'auto'}}>
        {SUBTABS.map(st=>(
          <div key={st.key} onClick={()=>setSub(st.key)}
            style={{padding:'8px 14px',fontSize:12,cursor:'pointer',opacity:st.v12?.5:1,

              borderBottom:sub===st.key?'2px solid var(--accent)':'2px solid transparent'}}>
            {st.label}{st.v12?<span className="evo-badge v12">V1.2+</span>:''}

        ))}

      <div className="asset-layout" style={{margin:'0 -16px',flex:1}}>
        <div className="asset-left">
          {list.map((item,i)=>(
            <div key={i} onClick={()=>setSelIdx(i)}
              style={{display:'flex',alignItems:'center',gap:8,padding:'8px 10px',borderRadius:6,cursor:'pointer',fontSize:12,marginBottom:2,
                background:selIdx===i?'var(--bg-card)':'transparent',border:selIdx===i?'1px solid var(--accent)':'1px solid transparent'}}>
              <span style={{width:8,height:8,borderRadius:'50%',flexShrink:0,background:item.done?'var(--success)':'var(--text-dim)'}}/>
              <span style={{flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{item.name}</span>
              {item.source&&<span style={{fontSize:10,color:'var(--text-dim)'}}>{item.source==='imported'?'📥':'🤖'}</span>}
              {item.status&&statusBadge(item.status)}
            </div>
          ))}
          {(sub==='voice'||sub==='scene'||sub==='item'||sub==='char')&&
            <button className="btn" style={{width:'100%',marginTop:8,borderStyle:'dashed'}} onClick={()=>toast('添加新条目')}>+ 添加</button>}

        </div>
        <div className="asset-right">{renderDetail()}</div>
      </div>
    </div>
  );
}

        <div style={{display:'flex',height:'100%'}}>
          <div style={{width:280,borderRight:'1px solid var(--border)',overflowY:'auto',padding:8}}>
            {D.sbs.map(sb=><div key={sb.id} onClick={()=>setSelSb(sb)} style={{display:'flex',alignItems:'center',gap:10,padding:10,marginBottom:4,borderRadius:6,cursor:'pointer',background:selSb?.id===sb.id?'var(--bg-card)':'transparent',border:selSb?.id===sb.id?'1px solid var(--accent)':'1px solid transparent'}}>
              <div style={{width:64,height:36,borderRadius:4,background:'var(--bg-input)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:18}}>🎬</div>
              <div style={{flex:1,minWidth:0}}><div style={{fontSize:10,color:'var(--text-dim)'}}>S{sb.order.toString().padStart(2,'0')}</div><div style={{fontSize:12,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{sb.desc}</div><div style={{fontSize:10,marginTop:2}}>{statusBadge(sb.status)}</div></div>
            </div>)}
            <button className="btn" style={{width:'100%',marginTop:8,borderStyle:'dashed'}}>+ 添加分镜</button>
          </div>
          <div style={{flex:1,padding:16,overflowY:'auto'}}>
            {selSb&&<>
              <div className="form-group"><label>📝 分镜描述</label><textarea style={{minHeight:50}} value={selSb.desc} readOnly/></div>
              <div style={{marginBottom:12}}><label style={{fontSize:11,color:'var(--text-dim)',marginBottom:4,display:'block'}}>🎥 镜头参数 <span className="evo-badge v12">V1.2+</span></label><div style={{display:'flex',gap:8}}><span style={{padding:'4px 10px',borderRadius:6,background:'var(--bg-input)',border:'1px solid var(--border)',fontSize:11}}>景别: 中景</span><span style={{padding:'4px 10px',borderRadius:6,background:'var(--bg-input)',border:'1px solid var(--border)',fontSize:11}}>角度: 眼平</span><span style={{padding:'4px 10px',borderRadius:6,background:'var(--bg-input)',border:'1px solid var(--border)',fontSize:11}}>运动: 缓慢推进</span></div></div>
              <div style={{marginBottom:12}}>
                <label style={{fontSize:11,color:'var(--text-dim)',marginBottom:6,display:'block'}}>💬 三类提示词 <span className="evo-badge v12">V1.2+</span></label>
                <div className="prompt-block"><div className="pb-header"><span className="prompt-tag env">🌍 环境提示词</span><span style={{fontSize:10,color:'var(--text-dim)'}}>region: full</span></div><div className="prompt-text">哥特式古宅大厅，破碎彩窗月光，石壁古老纹路，地面复杂符文阵，灰尘在光束中飘浮，暖黄顶光与蓝色符文冷光交织</div></div>
                <div className="prompt-block"><div className="pb-header"><span className="prompt-tag char">👤 角色提示词</span><span style={{fontSize:10,color:'var(--text-dim)'}}>region: person_bbox | ref: char_001</span></div><div className="prompt-text">林墨，黑色短发，清瘦面容，深蓝风衣，灰色高领毛衣，黑色长裤，皮质短靴，侧身站立姿态</div></div>
                <div className="prompt-block"><div className="pb-header"><span className="prompt-tag fx">✨ 动作/特效提示词</span><span style={{fontSize:10,color:'var(--text-dim)'}}>region: fx_mask | isolation: on</span></div><div className="prompt-text">蓝色符文从地面渐亮，冷光向上漫射照亮面部，光晕脉动效果，粒子漂浮</div></div>
              </div>
              <div style={{marginBottom:12}}><label style={{fontSize:11,color:'var(--text-dim)',marginBottom:6,display:'block'}}>⏱ 时间轴 <span className="evo-badge v12">V1.2+</span></label><div className="timeline-box"><div className="tl-ruler"><span>0s</span><span>1s</span><span>2s</span><span>3s</span><span>4s</span><span>4.5s</span></div><div className="tl-track"><div className="tl-event action" style={{left:0,width:'33%'}}>🎬 镜头推进</div><div className="tl-event fx" style={{left:'30%',width:'44%'}}>✨ 符文渐亮 · ease_in</div><div className="tl-event dialogue" style={{left:'55%',width:'45%'}}>💬 林墨低语 · tts</div></div></div></div>
              <div style={{marginBottom:12}}><label style={{fontSize:11,color:'var(--text-dim)',marginBottom:4,display:'block'}}>📎 引用的锚定资产</label><div style={{display:'flex',gap:6,flexWrap:'wrap'}}><span className="ref-tag">📸 林墨 · 角色书</span><span className="ref-tag">🏙 古宅大厅 · 场景标注</span><span className="ref-tag">🎨 暗黑哥特 · 风格参考</span></div></div>
              <div style={{display:'flex',gap:8}}>
                <button className="btn primary" onClick={()=>doToast('调用生图模型...')}>🖼 生成图片</button>
                <button className="btn" onClick={()=>doToast('调用视频模型...')}>🎥 生成视频</button>
                <button className="btn" onClick={()=>doToast('调用 TTS...')}>🔊 生成配音</button>
              </div>
            </>}
          </div>
        </div>
      );
      case 'asset': return <AssetPanel sub={assetSub} setSub={setAssetSub} toast={doToast}/>;
    }
  };

  return (
    <Toaster.Provider value={doToast}>
      <div className="toolbar">
        <span style={{fontWeight:600,fontSize:13,color:'var(--text-bright)'}}>📁 {D.project.name}</span>
        <span className="spacer"/>
        <span style={{fontSize:10,color:'var(--warning)',marginRight:4}}>🌐 Demo</span>
        <button className="btn" onClick={()=>setShowExport(true)}>📦 合成导出</button>
        <button className="btn" onClick={()=>setShowSettings(true)}>⚙ 设置</button>
      </div>
      <div className="app-shell">
        <div className="sidebar">
          <div className="sidebar-header">📁 项目列表</div>
          <div style={{flex:1,overflowY:'auto',padding:'4px 8px'}}>
            <div style={{display:'flex',alignItems:'center',gap:8,padding:'8px 10px',borderRadius:6,background:'var(--accent)',color:'#fff',fontSize:13,marginBottom:2}}>古宅探秘·第1集</div>
            <div style={{display:'flex',alignItems:'center',gap:8,padding:'8px 10px',borderRadius:6,fontSize:13,color:'var(--text-dim)'}}>长安十二时辰改编</div>
            <div style={{display:'flex',alignItems:'center',gap:8,padding:'8px 10px',borderRadius:6,fontSize:13,color:'var(--text-dim)'}}>产品宣传片V3</div>
          </div>
          <div style={{padding:8,borderTop:'1px solid var(--border)'}}><button className="btn" style={{width:'100%',borderStyle:'dashed'}} onClick={()=>doToast('创建新项目')}>+ 新建项目</button></div>
        </div>
        <div className="main-editor">
          <div className="tab-bar">{TABS.map(t=><div key={t.key} className={`tab${tab===t.key?' active':''}`} onClick={()=>setTab(t.key)}>{t.label}</div>)}</div>
          <div className="tab-content">{renderContent()}</div>
        </div>
        <div className="preview-panel">
          <div style={{padding:12,borderBottom:'1px solid var(--border)',fontSize:11,color:'var(--text-dim)',textTransform:'uppercase',letterSpacing:1}}>👁 预览</div>
          <div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',padding:16}}>
            <div style={{textAlign:'center',color:'var(--text-dim)'}}><div style={{fontSize:64,marginBottom:8,opacity:.3}}>🖼</div><div style={{fontSize:12}}>选择分镜或资产<br/>预览生成结果</div></div>
          </div>
          <div style={{padding:10,borderTop:'1px solid var(--border)',display:'flex',gap:6,justifyContent:'center'}}>
            <button className="btn sm">⏮</button><button className="btn sm" onClick={()=>doToast('▶ 播放')}>▶</button><button className="btn sm">⏭</button>
            <span style={{fontSize:11,color:'var(--text-dim)',marginLeft:8}}>00:00 / 00:05</span>
          </div>
        </div>
      </div>
      {showSettings&&<SettingsModal onClose={()=>setShowSettings(false)} toast={doToast}/>}
      {showChar&&<CharacterModal char={editingChar} onClose={()=>setShowChar(false)} toast={doToast}/>}
      {showExport&&<ExportModal onClose={()=>setShowExport(false)} toast={doToast}/>}
      {toast&&<div className="toast">{toast}</div>}
    </Toaster.Provider>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
